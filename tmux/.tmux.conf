# ── Terminal & colors ──────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"

# ── Behavior ───────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on

# ── Key bindings (prefix stays C-b) ───────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
bind P display-popup -E -w 80% -h 80% -d "#{pane_current_path}" -e TMUX_POPUP=1
bind '#' command-prompt -I "#{@desc}" -p "Description:" "set-option @desc '%%'"
bind s choose-tree -Zs -F "#{session_windows}w#{?@desc, — #{@desc},}"
set -s command-alias[100] 'ls=list-sessions -F "#{session_name}: #{session_windows} windows (created #{t:session_created})#{?session_grouped, (group #{session_group}),}#{?session_attached, (attached),}#{?@desc, — #{@desc},}"'

# ── Plugins (TPM: prefix I install, prefix U update) ──────────────
set -g @plugin 'tmux-plugins/tpm'
# Theme first: battery, pomodoro and continuum fill in/hook status-left/right, so they must load after it
set -g @plugin 'wabri/tmux-nord-plusplus'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'olimorris/tmux-pomodoro-plus'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
# Pomodoro defaults (p, P) would override previous-window and the popup binding
set -g @pomodoro_toggle 'T'
set -g @pomodoro_cancel 'X'


# Keep this line last, apart from overrides of theme settings below
run '~/.tmux/plugins/tpm/tpm'

# ── Theme overrides (must follow tpm, which applies the theme) ────
setw -g pane-border-lines heavy
setw -g pane-active-border-style "fg=#88c0d0"
# Default lengths (10/40) truncate the session name and right-hand segments
set -g status-left-length 100
set -g status-right-length 100
# Session description (prefix #) as an extra segment after the session name
set -ga status-left "#{?@desc,#[fg=black#,bg=brightblack]#[fg=white#,bg=brightblack] #{@desc} #[fg=brightblack#,bg=black],}"
# Rebuild the theme's status-right: white text instead of brightblack, battery only
# where one exists. Keep continuum's autosave hook first, as the plugin would.
set -g status-right "#($HOME/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
if-shell 'ls /sys/class/power_supply/BAT* >/dev/null 2>&1 || pmset -g batt 2>/dev/null | grep -q InternalBattery' \
  'set -ga status-right "#[fg=red,bg=black,nobold]#[fg=white,bg=red] #($HOME/.tmux/plugins/tmux-battery/scripts/battery_icon_status.sh)#($HOME/.tmux/plugins/tmux-battery/scripts/battery_percentage.sh) #[fg=black,bg=red]"'
set -ga status-right "#[fg=blue,bg=black,nobold]#[fg=white,bg=blue] %Y-%m-%d #[fg=white,bg=blue]#[fg=white,bg=blue] %H:%M #[fg=black,bg=blue]#[fg=cyan,bg=black]#[fg=black,bg=cyan,bold] #H "
# Claude Code context usage for the active pane (set by ~/.claude/statusline-tmux.sh);
# shown only while that pane is running claude, so stale values disappear on exit
set -ga status-right "#{?#{&&:#{@claude_ctx},#{==:#{pane_current_command},claude}},#[fg=#{@claude_ctx_colour}#,bg=cyan#,nobold]#[fg=black#,bg=#{@claude_ctx_colour}#,bold] ctx #{@claude_ctx}% ,}"
